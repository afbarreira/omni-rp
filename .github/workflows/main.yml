name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Os arquivos ficam todos soltos no repositório; aqui eles vão para as pastas certas
      - name: Organizar arquivos
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Instalar dependências
        run: |
          npm install
          command -v convert >/dev/null || (sudo apt-get update && sudo apt-get install -y imagemagick)

      - name: Criar projeto Android (Capacitor)
        run: npx cap add android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Ícone e tela de abertura do Omni RP
        run: |
          R=android/app/src/main/res
          rm -f $R/drawable-v24/ic_launcher_foreground.xml $R/drawable/ic_launcher_background.xml
          rm -rf $R/mipmap-anydpi-v26
          find $R -name 'ic_launcher*' -delete
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n a f <<< "$d"; mkdir -p $R/mipmap-$n
            convert icone.png -resize ${a}x${a} $R/mipmap-$n/ic_launcher.png
            convert icone-redondo.png -resize ${a}x${a} $R/mipmap-$n/ic_launcher_round.png
            convert icone-frente.png -resize ${f}x${f} $R/mipmap-$n/ic_launcher_foreground.png
          done
          mkdir -p $R/mipmap-anydpi-v26
          for x in ic_launcher ic_launcher_round; do
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@color/ic_launcher_background"/>\n  <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n' > $R/mipmap-anydpi-v26/$x.xml
          done
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <color name="ic_launcher_background">#000000</color>\n</resources>\n' > $R/values/ic_launcher_background.xml
          find $R -name 'splash.png' -delete
          cp splash.png $R/drawable/splash.png
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Omni RP</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Omni RP</string>#' $R/values/strings.xml

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: omni-rp-apk
          path: android/app/build/outputs/apk/debug/*.apk
